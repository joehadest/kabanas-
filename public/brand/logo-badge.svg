<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Boteco Kabanas Beer">
  <defs>
    <linearGradient id="kb-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7e8b8"/>
      <stop offset="35%" stop-color="#e8c96a"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1a"/>
    </linearGradient>
    <linearGradient id="kb-gold-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6d1a"/>
      <stop offset="50%" stop-color="#f2dfa0"/>
      <stop offset="100%" stop-color="#8a6d1a"/>
    </linearGradient>
    <radialGradient id="kb-bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1a1610"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <path id="kb-top-arc" d="M 32 104 A 68 68 0 0 1 168 104"/>
  </defs>

  <!-- Selo -->
  <circle cx="100" cy="100" r="99" fill="url(#kb-bg)"/>
  <circle cx="100" cy="100" r="96" stroke="url(#kb-gold)" stroke-width="2.8"/>
  <circle cx="100" cy="100" r="89" stroke="url(#kb-gold)" stroke-width="1" opacity="0.45"/>

  <!-- Canecas brindando -->
  <g stroke="url(#kb-gold)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <!-- Caneca esquerda -->
    <path d="M72 56v17c0 2.6 2 4.6 4.5 4.6h6.5V56H72z" fill="none"/>
    <path d="M72 56h11v3.2H72z" fill="url(#kb-gold)" stroke="none" opacity="0.4"/>
    <!-- Caneca direita -->
    <path d="M114 52l9.5 3.8v17c0 2.6-2 4.6-4.5 4.6h-6.5V56l2.5-4z" fill="none"/>
    <path d="M114 52l9.5 3.8v3H114z" fill="url(#kb-gold)" stroke="none" opacity="0.4"/>
    <!-- Brinde -->
    <path d="M91 50l9 7"/>
    <!-- Espuma -->
    <ellipse cx="80" cy="55" rx="5" ry="2.2" fill="#f5f0e0" stroke="none" opacity="0.85"/>
    <ellipse cx="121" cy="53" rx="5" ry="2.2" fill="#f5f0e0" stroke="none" opacity="0.85"/>
  </g>

  <!-- Ornamentos laterais superiores -->
  <g stroke="url(#kb-gold-h)" stroke-width="0.9" stroke-linecap="round" opacity="0.75">
    <path d="M48 68h14M55 68v3M48 71h10"/>
    <path d="M152 68h-14M145 68v3M152 71h-10"/>
  </g>

  <!-- BOTECO -->
  <text fill="url(#kb-gold)" font-size="10.2" font-family="system-ui, Segoe UI, sans-serif" font-weight="700" letter-spacing="4">
    <textPath href="#kb-top-arc" startOffset="50%" text-anchor="middle">BOTECO</textPath>
  </text>

  <!-- KABANAS -->
  <text
    x="100"
    y="116"
    text-anchor="middle"
    fill="url(#kb-gold)"
    font-size="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    letter-spacing="2"
  >KABANAS</text>

  <!-- BEER -->
  <text
    x="100"
    y="130"
    text-anchor="middle"
    fill="url(#kb-gold)"
    font-size="9.8"
    font-family="system-ui, Segoe UI, sans-serif"
    font-weight="700"
    letter-spacing="6"
  >BEER</text>

  <!-- Lúpulo central inferior -->
  <g fill="url(#kb-gold)">
    <ellipse cx="100" cy="149" rx="4.8" ry="7.5"/>
    <path d="M96 141.5c1.2-4 2.8-6.2 4-6.2s2.8 2.2 4 6.2" fill="none" stroke="url(#kb-gold)" stroke-width="1.1"/>
    <path d="M98 143.5c0-2.2 1-3.8 2-3.8s2 1.6 2 3.8" fill="none" stroke="#0a0a0a" stroke-width="0.55" opacity="0.4"/>
    <path d="M100 134v4" stroke="url(#kb-gold)" stroke-width="0.9"/>
    <path d="M97 135.5l3-2 3 2" stroke="url(#kb-gold)" stroke-width="0.7" fill="none"/>
  </g>

  <!-- Trigo / cevada -->
  <g stroke="url(#kb-gold)" stroke-width="1.05" stroke-linecap="round" fill="none">
    <path d="M68 154c4-6 8-8.5 12-8.5"/>
    <path d="M70 151c2.5-3.5 5-5 7.5-5M72 155c1.8-2.8 3.5-4 5.2-4"/>
    <path d="M74 148c1-2 2.2-3 3.5-3M76 152c.8-1.5 1.6-2.4 2.5-2.4"/>
    <path d="M132 154c-4-6-8-8.5-12-8.5"/>
    <path d="M130 151c-2.5-3.5-5-5-7.5-5M128 155c-1.8-2.8-3.5-4-5.2-4"/>
    <path d="M126 148c-1-2-2.2-3-3.5-3M124 152c-.8-1.5-1.6-2.4-2.5-2.4"/>
  </g>
</svg>
