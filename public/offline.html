<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Você está offline — Kabanas Delivery</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff2ed; color: #7c1f10; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 24px; }
  .box { max-width: 360px; }
  h1 { font-size: 1.25rem; margin-bottom: 8px; }
  p { color: #9a220f; margin-bottom: 20px; }
  button { background: #f9481a; color: #fff; border: none; padding: 12px 20px; border-radius: 999px; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>Sem conexão no momento</h1>
    <p>Verifique sua internet. Assim que reconectar, o app volta ao normal.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
