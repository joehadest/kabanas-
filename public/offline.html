<!doctype html>
<html lang="pt-BR">
<head>

<meta name="theme-color" content="#2c2c2c" />

<style>

    font-family: system-ui, -apple-system, sans-serif;

    justify-content: center;

    background: #d4af37;
    color: #1a1a1a;
    border: none;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/brand/logo-kabanas.jpg" alt="Boteco Kabanas Beer" />
    <h1>Sem conexão no momento</h1>
    <p>Verifique sua internet. Assim que reconectar, o app volta ao normal.</p>
    <button onclick="location.reload()">Tentar novamente</button>

</html>
